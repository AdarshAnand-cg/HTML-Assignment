<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 style="text-align: left;"><img src="flower.jpg" alt="Flower Image" title="Flower Image" width="300" height="200"></h1>    
    <hr><h1 style="text-align: center;"><img src="images/logo.jpg" alt="Bird Logo" title="Logo Image" width="200" height="200"></h1>
<hr><h1 style="text-align: right;"><img src="images/assets/images/banner.png" alt="Banner Image" title="Banner Image" width="300" height="150"></h1>
<hr><img src="pages/photo.png" alt="Photo Image" title="Photo Image" width="800" height="400">
<br><hr><hr><h1 style="text-align: center;"><img src="images/Nature.png" alt="Beautiful nature view" title="Its just a normal screenshot" width="300" height="200" ></h1>
<img src="Natural pic.png" alt="Natural pic" title="Natural pic" width="300" height="200" loading="lazy">
<br><hr><img src="Hero.jpg" alt="Hero Image" title="Vijay Thalapaty" width="450" height="500" loading="eager">
<img src="Doom.png" alt="Doom Image" title="Dr. Doom. now, the 'auto'loading let the browser decide when to load the photo according to its priority" width="450" height="500" loading="auto">
<img src="flower.jpg"
srcset="Doom.jpg 400w,Hero.png 800w,Natural pic.png 1200w"
sizes="50vw"
>
<br><hr><img src="Images/Nature.png" alt="Beautiful nature view" title="Its just a normal screenshot" width="300" height="200" loading="lazy"
      srcset="Images/Nature.png 300w, Natural pic.png 600w, Images/Nature.png 900w">

      <hr><br><img src="Images/logo.jpg" alt="Beautiful Flowers" loading="eager" width="250">
<img src="flowers.png" alt="Beautiful Flowers" loading="lazy" width="250" height="250">

</body>
</html>
